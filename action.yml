name: Preview deployment plan
description: Validate a version and target and return a JSON plan. Never deploys anything.
author: Austen Stone
inputs:
  version:
    description: Three non-negative integers separated by dots, without leading zeroes.
    required: true
  target:
    description: Either preview or staging. Production is deliberately unsupported.
    required: false
    default: preview
outputs:
  plan:
    description: JSON containing schemaVersion, version, target, and dryRun.
runs:
  using: node24
  main: dist/index.js
