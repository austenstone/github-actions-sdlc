name: Nonexecuted scanner fixture
on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  fixture:
    runs-on: ubuntu-slim
    timeout-minutes: 3
    env:
      LAB_CANARY: ${{ secrets.LAB_REPO_CANARY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: echo "${{ github.event.issue.title }}"
