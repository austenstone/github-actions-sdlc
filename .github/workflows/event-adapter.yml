name: Default-branch event adapter
on:
  schedule:
    - cron: '23 7 * * 2'
  repository_dispatch:
    types: [preview-plan]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  normalize:
    name: Normalize real event
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.inputs.outputs.version }}
      target: ${{ steps.inputs.outputs.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - id: inputs
        run: node scripts/event-inputs.ts
  plan:
    name: Run normalized plan
    needs: normalize
    uses: ./.github/workflows/plan.yml # zizmor: ignore[self-repository]
    with:
      version: ${{ needs.normalize.outputs.version }}
      target: ${{ needs.normalize.outputs.target }}
