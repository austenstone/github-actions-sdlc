name: Runtime experiment
on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:
  repository_dispatch:
    types: [preview-plan]
  schedule:
    - cron: '23 7 * * 2'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observe:
    name: Runtime experiment
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Observe the definition and checked-out revision
        env:
          MARKER: workflow-lab-v1
          REPO_CANARY_PRESENT: ${{ secrets.LAB_REPO_CANARY != '' }}
        run: |
          {
            printf 'Marker: %s\n\nEvent: %s\n\nRef: %s\n\n' "${MARKER}" "${GITHUB_EVENT_NAME}" "${GITHUB_REF}"
            printf 'Workflow SHA: %s\n\nCheckout SHA: %s\n\n' "${GITHUB_WORKFLOW_SHA}" "$(git rev-parse HEAD)"
            printf 'Synthetic repository secret available: %s\n' "${REPO_CANARY_PRESENT}"
          } | tee -a "${GITHUB_STEP_SUMMARY}"
